<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Header Number Stamper</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-center items-center p-4">
  <div class="bg-white rounded-xl shadow-lg p-6 max-w-xl w-full border border-gray-200">
    <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">PDF Header Stamper</h1>
    <p class="text-sm text-gray-500 text-center mb-6">Add <span id="textPreview" class="font-semibold text-black">the text you enter</span> to the top of every page of <span id="pdfNamePreview" class="font-semibold">your selected PDF</span></p>

    <!-- File Input -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Select PDF File</label>
      <input type="file" id="pdfFileInput" accept="application/pdf" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border rounded-lg p-2">
    </div>

    <!-- Controls Grid -->
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Text to Insert</label>
        <input type="text" id="headerText" placeholder="Enter text to insert" class="w-full border rounded-lg p-2 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Position</label>
        <select id="textPosition" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <option value="center" selected>Top Center</option>
          <option value="right">Top Right</option>
          <option value="left">Top Left</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Font Size (pt)</label>
        <input type="number" id="fontSize" value="14" min="8" max="36" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Top Margin (pt)</label>
        <input type="number" id="topMargin" value="25" min="5" max="100" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
    </div>

    <!-- Process Button -->
    <button id="processBtn" onclick="processPDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition duration-200">
      Stamp PDF & Download
    </button>

    <div id="statusMessage" class="mt-4 text-center text-sm hidden font-medium"></div>
  </div>

  <script>
    const headerTextInput = document.getElementById('headerText');
    const textPreview = document.getElementById('textPreview');
    const pdfFileInput = document.getElementById('pdfFileInput');
    const pdfNamePreview = document.getElementById('pdfNamePreview');

    headerTextInput.addEventListener('input', () => {
      const value = headerTextInput.value.trim();
      textPreview.textContent = value || 'the text you enter';
    });

    pdfFileInput.addEventListener('change', () => {
      const file = pdfFileInput.files[0];
      pdfNamePreview.textContent = file ? file.name : 'your selected PDF';
    });

    async function processPDF() {
      const fileInput = document.getElementById('pdfFileInput');
      const status = document.getElementById('statusMessage');
      const text = document.getElementById('headerText').value.trim();
      const position = document.getElementById('textPosition').value;
      const fontSize = parseFloat(document.getElementById('fontSize').value) || 14;
      const topMargin = parseFloat(document.getElementById('topMargin').value) || 25;

      if (!fileInput.files.length) {
        status.textContent = 'Please select a PDF file first.';
        status.className = 'mt-4 text-center text-sm font-medium text-red-600';
        status.classList.remove('hidden');
        return;
      }

      if (!text) {
        status.textContent = 'Please enter text to insert first.';
        status.className = 'mt-4 text-center text-sm font-medium text-red-600';
        status.classList.remove('hidden');
        return;
      }

      status.textContent = 'Processing PDF... Please wait.';
      status.className = 'mt-4 text-center text-sm font-medium text-blue-600';
      status.classList.remove('hidden');

      try {
        const file = fileInput.files[0];
        const arrayBuffer = await file.arrayBuffer();
        
        // Load PDF using pdf-lib
        const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
        const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
        const pages = pdfDoc.getPages();

        pages.forEach((page) => {
          const { width, height } = page.getSize();
          const textWidth = font.widthOfTextAtSize(text, fontSize);

          let x = (width - textWidth) / 2; // Center default
          if (position === 'right') x = width - textWidth - 30;
          if (position === 'left') x = 30;

          const y = height - topMargin;

          // Draw text in black color
          page.drawText(text, {
            x: x,
            y: y,
            size: fontSize,
            font: font,
            color: PDFLib.rgb(0, 0, 0)
          });
        });

        const modifiedPdfBytes = await pdfDoc.save();
        
        // Trigger download
        const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = file.name.replace('.pdf', '') + '_numbered.pdf';
        link.click();

        status.textContent = 'Done! Modified PDF downloaded successfully.';
        status.className = 'mt-4 text-center text-sm font-medium text-green-600';
      } catch (err) {
        console.error(err);
        status.textContent = 'Error processing PDF: ' + err.message;
        status.className = 'mt-4 text-center text-sm font-medium text-red-600';
      }
    }
  </script>
</body>
</html>
